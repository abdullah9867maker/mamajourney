<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الأم | Mama Journey</title>
<meta name="description" content="رحلة الأم: منصة تثقيفية ثنائية اللغة لمتابعة صحة الأم من التخطيط للحمل حتى ما بعد الولادة. مشروع طلابي، كلية التمريض، جامعة سليمان الراجحي.">
<meta name="theme-color" content="#A84B64">
<meta property="og:title" content="رحلة الأم | Mama Journey">
<meta property="og:description" content="منصة تثقيفية لمتابعة صحة الأم: حاسبات الحمل، وسجل التحاليل، ودليل الأعراض.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23F8E4EA'/%3E%3Cpath d='M27.5 9.5a11.5 11.5 0 1 0 3 15.6A9 9 0 0 1 27.5 9.5Z' fill='%23A84B64'/%3E%3Cpath d='M18.6 24.6s-4.6-2.7-4.6-5.8c0-1.6 1.2-2.8 2.7-2.8.9 0 1.6.4 1.9 1.1.4-.7 1.1-1.1 2-1.1 1.5 0 2.7 1.2 2.7 2.8 0 3.1-4.7 5.8-4.7 5.8Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: the site is laid out like the journey itself — a sidebar of stations (planning → pregnancy → after birth → newborn), a bead ring for "where am I", and a journey rail for the whole ~15 months. One tool open at a time. */
:root{
  --paper:#FBF6F4; --surface:#FFFFFF; --surface-2:#F6EEF0; --surface-3:#EFE3E7;
  --ink:#2D1E2A; --ink-2:#5B4756; --muted:#6F5B68; --line:#EBDFE4; --line-2:#DCCBD2;
  --rose:#A84B64; --rose-ink:#973D56; --rose-soft:#F8E4EA; --rose-mid:#D99AAB;
  --plum:#53248B; --plum-soft:#EFE7F7; --plum-mid:#A58AD0;
  --cyan:#00AEDB; --cyan-ink:#0B6B93; --cyan-soft:#DFF2F9;
  --peach:#D9825B; --peach-ink:#9A4A28; --peach-soft:#FBE9DF;
  --good:#3F8A5F; --good-ink:#2F6E4A; --good-soft:#E2F2E8;
  --warn:#C98A2B; --warn-ink:#8A5A12; --warn-soft:#FBF0D9;
  --bad:#C0453F; --bad-ink:#A3332E; --bad-soft:#FAE2DF;
  --on-accent:#FFFFFF;
  --t1:#EBC3CD; --t2:#CF8597; --t3:#A84B64; --bead-empty:#E6D7DD;
  --s1:#B0526B; --s2:#1F7FB5;
  --font-display:"El Messiri","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --side-w:276px;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --shadow-hero:0 1px 2px rgba(45,30,42,.05),0 24px 48px -28px rgba(83,36,139,.28);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#17111A; --surface:#211923; --surface-2:#2B212E; --surface-3:#352938;
    --ink:#F5EBF1; --ink-2:#D4C2CD; --muted:#A8949F; --line:#3A2D3E; --line-2:#4A3A4E;
    --rose:#EE98AE; --rose-ink:#F2A8BB; --rose-soft:#3E2530; --rose-mid:#9B5468;
    --plum:#C3A6EE; --plum-soft:#2E2340; --plum-mid:#7B5DAA;
    --cyan:#4CC6EA; --cyan-ink:#7FD0EE; --cyan-soft:#14303C;
    --peach:#F0A27F; --peach-ink:#F3B08F; --peach-soft:#3A2820;
    --good:#6CC08E; --good-ink:#93D6AD; --good-soft:#1E3227;
    --warn:#E2A84A; --warn-ink:#F2C67F; --warn-soft:#3A2E1A;
    --bad:#EE7B73; --bad-ink:#F7A7A0; --bad-soft:#40211F;
    --on-accent:#2A1620;
    --t1:#6B3E4C; --t2:#B0647A; --t3:#EE98AE; --bead-empty:#44364A;
    --s1:#C9687F; --s2:#4F94DB;
    --shadow-hero:0 1px 2px rgba(0,0,0,.3),0 24px 48px -28px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#17111A; --surface:#211923; --surface-2:#2B212E; --surface-3:#352938;
  --ink:#F5EBF1; --ink-2:#D4C2CD; --muted:#A8949F; --line:#3A2D3E; --line-2:#4A3A4E;
  --rose:#EE98AE; --rose-ink:#F2A8BB; --rose-soft:#3E2530; --rose-mid:#9B5468;
  --plum:#C3A6EE; --plum-soft:#2E2340; --plum-mid:#7B5DAA;
  --cyan:#4CC6EA; --cyan-ink:#7FD0EE; --cyan-soft:#14303C;
  --peach:#F0A27F; --peach-ink:#F3B08F; --peach-soft:#3A2820;
  --good:#6CC08E; --good-ink:#93D6AD; --good-soft:#1E3227;
  --warn:#E2A84A; --warn-ink:#F2C67F; --warn-soft:#3A2E1A;
  --bad:#EE7B73; --bad-ink:#F7A7A0; --bad-soft:#40211F;
  --on-accent:#2A1620;
  --t1:#6B3E4C; --t2:#B0647A; --t3:#EE98AE; --bead-empty:#44364A;
  --s1:#C9687F; --s2:#4F94DB;
  --shadow-hero:0 1px 2px rgba(0,0,0,.3),0 24px 48px -28px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
html[lang="en"] body{line-height:1.6}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.3;text-wrap:balance;font-weight:700;letter-spacing:0}
h1{font-size:clamp(1.85rem,3.4vw,2.5rem)}
h2{font-size:1.45rem}
h3{font-size:1.18rem;font-weight:600}
p{margin:0}
a{color:var(--rose-ink);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px;border-radius:10px}
.num,td,.tabular{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:200;text-decoration:none;font-weight:600}
.skip:focus{top:12px}

/* ---------- App shell ---------- */
.side{position:fixed;inset-block:0;inset-inline-start:0;width:var(--side-w);background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;z-index:40;overflow-y:auto;padding:20px 16px 16px}
.main-wrap{margin-inline-start:var(--side-w);min-height:100vh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:30px 36px 48px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--font-display);font-size:1.45rem;font-weight:700;display:block;line-height:1.15}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.35;margin-top:2px}
.side-row{display:flex;gap:8px;align-items:stretch}
.side-row .sos-btn{flex:1;width:auto;min-height:44px}
.side-stage{margin:16px 0 4px;padding:14px;border-radius:var(--r-md);background:var(--surface-2);text-decoration:none;color:var(--ink);display:block}
.side-stage .lbl{font-size:.78rem;color:var(--muted);display:block}
.side-stage b{font-family:var(--font-display);font-size:1.08rem;display:block;line-height:1.35}
.side-stage .mini-rail{margin-top:10px}
.nav-group{margin-top:14px}
.nav-group h2{font-family:var(--font-body);font-size:.78rem;font-weight:600;color:var(--muted);padding:0 12px;margin-bottom:6px}
.nav-group a{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:12px;text-decoration:none;color:var(--ink-2);font-weight:500;min-height:42px}
.nav-group a svg{width:20px;height:20px;flex:none}
.nav-group a .st{width:8px;height:8px;border-radius:50%;margin-inline-start:auto;flex:none}
.nav-group a:hover{background:var(--surface-2);color:var(--ink)}
.nav-group a[aria-current="page"]{background:var(--plum-soft);color:var(--plum);font-weight:600}
.side-foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:12px}
.sos-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;background:var(--bad-soft);color:var(--bad-ink);font-weight:700;min-height:48px;width:100%}
.sos-btn:hover{filter:brightness(.97)}
.affil{display:flex;flex-direction:column;gap:6px;padding:12px 8px 0;border-top:1px solid var(--line)}
.affil .fac{font-size:.82rem;color:var(--ink-2);font-weight:600}
.uni-logo{height:40px;width:auto;display:block;max-width:100%}
.uni-logo.dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .uni-logo.light{display:none}:root:not([data-theme="light"]) .uni-logo.dark{display:block}}
:root[data-theme="dark"] .uni-logo.light{display:none}
:root[data-theme="dark"] .uni-logo.dark{display:block}

@media (min-width:1024px) and (max-height:860px){
  .brand small{display:none}
  .side{padding-block:14px 12px}
  .side-stage{padding:10px 12px;margin:10px 0 2px}
  .side-stage .mini-rail{margin-top:6px}
  .nav-group{margin-top:8px}
  .nav-group h2{margin-bottom:2px}
  .nav-group a{min-height:38px;padding:5px 12px}
  .side-foot{padding-top:10px;gap:8px}
  .affil{padding-top:8px;gap:4px}
  .side .uni-logo{height:32px}
}
@media (min-width:1024px) and (max-height:760px){
  .nav-group h2{display:none}
  .nav-group{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
  .nav-group:first-of-type{border-top:0}
  .side-stage .lbl{display:none}
}
.topbar{display:none}
.tabbar{display:none}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:44px;min-width:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:.92rem;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.nav-scrim{position:fixed;inset:0;background:rgba(23,17,26,.45);z-index:39;display:none}

@media (max-width:1023px){
  .side{transform:translateX(calc(var(--dir,1) * 100%));transition:transform .22s ease;width:min(300px,86vw);box-shadow:0 0 40px rgba(0,0,0,.2)}
  html[dir="rtl"] .side{--dir:1} html[dir="ltr"] .side{--dir:-1}
  body.nav-open .side{transform:none}
  body.nav-open .nav-scrim{display:block}
  .main-wrap{margin-inline-start:0}
  main{padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .topbar .brand b{font-size:1.2rem}
  .topbar .brand small{display:none}
  .topbar .acts{margin-inline-start:auto;display:flex;gap:8px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;background:none;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600}
  .tabbar svg{width:22px;height:22px}
  .tabbar [aria-current="page"]{color:var(--plum);background:var(--plum-soft)}
}

/* ---------- Page head ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head p{color:var(--ink-2);max-width:62ch;margin-top:8px;font-size:1.03rem}
.view{display:none}
.view.on{display:block}

/* ---------- Generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:22px 24px;min-width:0}
.card > h3{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.card > .sub{color:var(--muted);font-size:.92rem;margin-bottom:14px}
.tint{background:var(--surface-2);border-color:transparent}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr;gap:18px}}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:32px 0 12px}
.section-h h2{font-size:1.3rem}
.hint{font-size:.88rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.95rem;padding:8px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.bul{margin:6px 0 0;padding-inline-start:20px}
.bul li{margin:4px 0}
.bul li::marker{color:var(--rose)}

/* Forms */
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.88rem;color:var(--ink-2);font-weight:600}
.field input,.field select,textarea{width:100%;border:1.5px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;min-height:46px;outline:none}
.field input:hover,.field select:hover{border-color:var(--muted)}
.field input:focus,.field select:focus,textarea:focus{border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}
input[type="date"]{direction:ltr;text-align:start}
html[dir="rtl"] input[type="date"]{text-align:right}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 10px;border-radius:var(--r-sm);cursor:pointer;min-height:44px}
.check:hover{background:var(--surface-2)}
.check input{width:20px;height:20px;accent-color:var(--plum);margin-top:4px;flex:none}
.check b{font-weight:600;display:block}
.check small{display:block;color:var(--muted);font-size:.86rem}
.inline-checks{display:flex;flex-wrap:wrap;gap:2px 12px}
.inline-checks .check{padding:6px 8px}

.btn{border:0;border-radius:999px;padding:10px 20px;min-height:44px;font-weight:600;background:var(--rose);color:var(--on-accent);display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-2)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.soft{background:var(--rose-soft);color:var(--rose-ink)}
.btn.small{min-height:40px;padding:6px 16px;font-size:.92rem}
.btn.danger{background:var(--bad-soft);color:var(--bad-ink)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.link{font-weight:600;text-decoration:none;color:var(--rose-ink)}
.link:hover{text-decoration:underline}

.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-weight:500;color:var(--ink-2);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(45,30,42,.12);font-weight:700}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px;font-size:.82rem;font-weight:600;white-space:nowrap;line-height:1.6}
.chip svg{width:14px;height:14px;flex:none}
.chip.good{background:var(--good-soft);color:var(--good-ink)}
.chip.watch{background:var(--warn-soft);color:var(--warn-ink)}
.chip.urgent{background:var(--bad-soft);color:var(--bad-ink)}
.chip.neutral{background:var(--surface-2);color:var(--ink-2)}
.chip.rose{background:var(--rose-soft);color:var(--rose-ink)}
.chip.peach{background:var(--peach-soft);color:var(--peach-ink)}
.chip.plum{background:var(--plum-soft);color:var(--plum)}
.chip.cyan{background:var(--cyan-soft);color:var(--cyan-ink)}
.badge-demo{display:inline-flex;gap:6px;align-items:center;background:var(--warn-soft);color:var(--warn-ink);border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:600}
.badge-demo svg{width:16px;height:16px}

/* Results */
.result{border-radius:var(--r-md);padding:16px 18px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.result.good{background:var(--good-soft)} .result.watch{background:var(--warn-soft)} .result.urgent{background:var(--bad-soft)}
.result .big{font-family:var(--font-display);font-size:1.75rem;font-weight:700;line-height:1.25}
.result .big small{font-family:var(--font-body);font-size:.95rem;font-weight:500;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;margin-top:10px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.kv div{background:var(--surface);padding:10px 12px}
.kv span{display:block;font-size:.8rem;color:var(--muted)}
.kv b{font-weight:700;font-size:1.02rem}

/* ---------- Home hero ---------- */
.home-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hero{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:12px 36px;align-items:center;background:var(--surface);border-radius:var(--r-lg);padding:28px 32px 24px;box-shadow:var(--shadow-hero);border:1px solid var(--line)}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding:20px 18px;gap:12px}}
.ring-wrap{position:relative;width:100%;max-width:330px;margin:0 auto;aspect-ratio:1}
.ring-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-center .n{font-family:var(--font-display);font-weight:700;font-size:clamp(3.4rem,10vw,5rem);line-height:1;color:var(--ink)}
.ring-center .u{font-size:.98rem;color:var(--ink-2);font-weight:500;margin-top:6px}
.ring-center .s{font-size:.84rem;color:var(--muted)}
.bead-now{transform-box:fill-box;transform-origin:center;animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
.bead-in{transform-box:fill-box;transform-origin:center;animation:beadIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes beadIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.bead-now,.bead-in{animation:none}}
.hero-body h1{margin:10px 0 8px}
.hero-body .lead{color:var(--ink-2);font-size:1.06rem;max-width:54ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:20px 0 0;border-top:1px solid var(--line);padding-top:16px;gap:14px 0}
.facts > div{padding-inline:16px;border-inline-start:1px solid var(--line)}
.facts > div:first-child{padding-inline-start:0;border-inline-start:0}
@media (max-width:560px){.facts{grid-template-columns:1fr 1fr}.facts > div{padding-inline:12px}.facts > div:nth-child(odd){padding-inline-start:0;border-inline-start:0}}
.facts dt{font-size:.82rem;color:var(--muted)}
.facts dd{margin:0;font-weight:700;font-size:1.08rem;line-height:1.4}
.facts dd.sub{font-weight:400;font-size:.86rem;color:var(--ink-2)}
.size-fact{display:flex;gap:10px;align-items:center}
details.edit{margin-top:16px}
details.edit summary{cursor:pointer;color:var(--rose-ink);font-weight:600;font-size:.94rem;list-style:none;display:inline-flex;gap:6px;align-items:center;min-height:40px}
details.edit summary::-webkit-details-marker{display:none}
details.edit summary svg{width:18px;height:18px}
details.edit[open] summary{margin-bottom:8px}

/* Journey rail */
.rail{grid-column:1/-1;margin-top:10px;padding-top:18px;border-top:1px dashed var(--line-2)}
.rail-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;font-size:.88rem;color:var(--muted)}
.rail-h b{color:var(--ink);font-weight:600}
.rail-track{display:flex;gap:4px;position:relative}
.rail-seg{position:relative;height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.rail-seg i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.rail-labels{display:flex;gap:4px;margin-top:8px}
.rail-labels div{font-size:.8rem;color:var(--ink-2);min-width:0}
.rail-labels b{display:block;font-weight:600;color:var(--ink);font-size:.86rem}
.rail-pin{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--surface);border:4px solid var(--rose);transform:translate(calc(var(--dir,1)*50%),-50%);box-shadow:0 2px 8px rgba(45,30,42,.25)}
html[dir="rtl"] .rail-pin{--dir:1} html[dir="ltr"] .rail-pin{--dir:-1}
.mini-rail{display:flex;gap:3px}
.mini-rail span{height:6px;border-radius:999px;background:var(--surface-3);position:relative;overflow:hidden}
.mini-rail span i{position:absolute;inset-block:0;inset-inline-start:0}

/* Dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,1fr);gap:16px;margin-top:18px;align-items:start}
@media (max-width:980px){.dash{grid-template-columns:1fr}}
.dash-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows li b{display:block;font-weight:600}
.rows li small{display:block;color:var(--muted);font-size:.84rem}
.rows .rv{display:flex;align-items:center;gap:10px;flex:none}
.rows .rv bdi{font-weight:700;white-space:nowrap}
.rows .rv bdi small{display:inline;font-weight:400}
.ok-line{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--good-soft);border-color:transparent}
.alerts{border:1.5px solid var(--warn)}
.alerts h3 .count{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:999px;background:var(--warn-soft);color:var(--warn-ink);font-family:var(--font-body);font-size:.84rem;padding:0 7px}
.alert-list{list-style:none;margin:10px 0 0;padding:0}
.alert-list li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:13px 0;border-top:1px solid var(--line)}
.alert-list li:first-child{border-top:0;padding-top:4px}
.alert-list .ic svg{width:20px;height:20px;margin-top:4px}
.alert-list li.watch .ic{color:var(--warn-ink)} .alert-list li.urgent .ic{color:var(--bad-ink)}
.alert-list bdi{white-space:nowrap}
.alert-list .more{font-size:.88rem;font-weight:600;white-space:nowrap;margin-top:3px;text-decoration:none}
.alert-list .more:hover{text-decoration:underline}
@media (max-width:560px){.alert-list li{grid-template-columns:auto 1fr}.alert-list .more{grid-column:2}}
.danger-card{border-color:var(--bad-soft)}
.danger-card h3{color:var(--bad-ink)}

/* Timeline */
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{position:relative;padding:0 0 18px;padding-inline-start:32px}
.tl li::before{content:"";position:absolute;inset-inline-start:9px;top:12px;bottom:-4px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;inset-inline-start:2px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.tl li.done::after{background:var(--good);border-color:var(--good)}
.tl li.now::after{background:var(--rose);border-color:var(--rose);box-shadow:0 0 0 5px var(--rose-soft)}
.tl li.late::after{background:var(--warn);border-color:var(--warn)}
.tl .when{font-size:.82rem;color:var(--muted);font-weight:600}
.tl .what{font-weight:600}
.tl .det{font-size:.9rem;color:var(--ink-2)}
.tl .check{padding:2px 0;min-height:36px;display:inline-flex;font-size:.88rem;color:var(--ink-2)}
.tl .check input{width:18px;height:18px;margin-top:5px}

/* ---------- Tool switcher ---------- */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;margin-bottom:18px}
.tools button{display:flex;gap:12px;align-items:flex-start;text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;min-height:64px;color:var(--ink);transition:border-color .15s,background .15s}
.tools button:hover{border-color:var(--line-2);background:var(--surface-2)}
.tools button svg{width:22px;height:22px;flex:none;margin-top:2px;color:var(--muted)}
.tools button b{display:block;font-weight:600;font-size:.95rem;line-height:1.4}
.tools button small{display:block;color:var(--muted);font-size:.8rem;line-height:1.4}
.tools button[aria-selected="true"]{border-color:var(--accent,var(--rose));background:var(--accent-soft,var(--rose-soft))}
.tools button[aria-selected="true"] svg{color:var(--accent-ink,var(--rose-ink))}
@media (max-width:700px){
  .tools{display:flex;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
  .tools::-webkit-scrollbar{display:none}
  .tools button{flex:none;min-width:150px}
  .tools button small{display:none}
  .tools button{min-height:52px;align-items:center}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px 28px}
@media (max-width:700px){.panel{padding:18px 16px;border-radius:var(--r-md)}}
.panel > header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.panel > header h2{font-size:1.5rem}
.panel > header p{color:var(--muted);font-size:.95rem;margin-top:4px;max-width:64ch}
.stage-pre{--accent:var(--peach);--accent-soft:var(--peach-soft);--accent-ink:var(--peach-ink)}
.stage-preg{--accent:var(--rose);--accent-soft:var(--rose-soft);--accent-ink:var(--rose-ink)}
.stage-post{--accent:var(--plum-mid);--accent-soft:var(--plum-soft);--accent-ink:var(--plum)}
.stage-baby{--accent:var(--cyan);--accent-soft:var(--cyan-soft);--accent-ink:var(--cyan-ink)}
.stage-food{--accent:var(--good);--accent-soft:var(--good-soft);--accent-ink:var(--good-ink)}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);background:var(--surface-2);font-size:.85rem}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:end}
td.nw{white-space:nowrap}

/* Charts */
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{font-family:var(--font-body);font-size:11.5px;fill:var(--muted)}
.chart .lbl-strong{font-weight:700}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:10px;font-size:.86rem;line-height:1.45;max-width:240px;opacity:0;transition:opacity .12s;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.tip.on{opacity:1}

/* Labs */
.labs-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.labs-layout{grid-template-columns:1fr}}
.test-list{display:flex;flex-direction:column;gap:6px;position:sticky;top:20px}
.test-list button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid transparent;background:transparent;border-radius:14px;padding:10px 12px;min-height:56px;text-align:start;color:var(--ink)}
.test-list button:hover{background:var(--surface)}
.test-list button b{display:block;font-weight:600;font-size:.94rem}
.test-list button span{display:block;font-size:.8rem;color:var(--muted)}
.test-list button[aria-selected="true"]{background:var(--surface);border-color:var(--rose)}
@media (max-width:980px){.test-list{flex-direction:row;overflow-x:auto;position:static;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.test-list::-webkit-scrollbar{display:none}.test-list button{flex:none;min-width:150px;background:var(--surface);border-color:var(--line)}}
.lab-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.lab-value{font-family:var(--font-display);font-size:2.6rem;font-weight:700;line-height:1}

/* Counters */
.counter{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.tap{width:min(220px,62vw);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,var(--rose-mid),var(--rose));color:var(--on-accent);font-family:var(--font-display);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 18px 36px -18px var(--rose),inset 0 -8px 16px rgba(0,0,0,.12);transition:transform .08s}
.tap:active{transform:scale(.96)}
.tap b{font-size:3.6rem;line-height:1;font-weight:700}
.tap span{font-family:var(--font-body);font-size:.95rem;font-weight:600}
.tap.alt{background:radial-gradient(circle at 35% 30%,var(--plum-mid),var(--plum))}
.tap.alt.running{background:radial-gradient(circle at 35% 30%,#E08A84,var(--bad))}
.timer{font-family:var(--font-display);font-size:1.7rem;font-weight:700;direction:ltr}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tally > div{background:var(--surface-2);border-radius:16px;padding:14px 10px;text-align:center}
.tally b{display:block;font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1.2}
.tally span{font-size:.86rem;color:var(--ink-2);display:block;font-weight:600}
.tally small{font-size:.78rem;color:var(--muted);display:block}
.tally .btn-row{justify-content:center;margin-top:8px}
.tally button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);font-size:1.2rem;font-weight:700}
.step-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);font-weight:700;font-size:1.05rem}

/* Calendar */
.cal-wrap{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.cal h4{font-family:var(--font-body);font-size:.95rem;font-weight:600;margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:.84rem}
.cal-grid .dow{color:var(--muted);font-size:.74rem}
.cal-grid .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-variant-numeric:tabular-nums}
.cal-grid .d.period{background:var(--rose-soft);color:var(--rose-ink);font-weight:600}
.cal-grid .d.fertile{background:var(--peach-soft);color:var(--peach-ink);font-weight:600}
.cal-grid .d.ovu{background:var(--peach);color:#fff;font-weight:700}
.cal-grid .d.today{outline:2px solid var(--ink);outline-offset:-2px}

/* Guide */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:240px;position:relative}
.search input{width:100%;border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:11px 46px 11px 18px;min-height:48px;outline:none}
html[dir="rtl"] .search input{padding:11px 18px 11px 46px}
.search input:focus{border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}
.search svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:16px;width:20px;height:20px;color:var(--muted)}
.g-card h3{font-size:1.12rem}
.tri{display:flex;flex-direction:column;margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tri > div{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--line);position:relative}
.tri > div:first-child{border-top:0}
.tri > div::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px}
.tri svg{width:22px;height:22px;grid-row:span 2;margin-top:2px}
.tri .lv{font-size:.82rem;font-weight:700}
.tri p{font-size:.94rem}
.tri .home::before{background:var(--good)} .tri .home .lv,.tri .home svg{color:var(--good-ink)}
.tri .clinic::before{background:var(--warn)} .tri .clinic .lv,.tri .clinic svg{color:var(--warn-ink)}
.tri .er{background:var(--bad-soft)} .tri .er::before{background:var(--bad)} .tri .er .lv,.tri .er svg{color:var(--bad-ink)}
.tri .none p{color:var(--muted);font-style:italic}

/* Banner */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-md);padding:14px 18px;background:var(--bad-soft);color:var(--bad-ink);margin-bottom:16px}
.banner svg{flex:none;width:24px;height:24px;margin-top:2px}

/* EPDS */
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q .qt{font-weight:600;margin-bottom:8px}
.q .opts{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.q .opts label{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:.92rem;min-height:44px}
.q .opts label:hover{border-color:var(--line-2)}
.q .opts label:has(input:checked){border-color:var(--plum);background:var(--plum-soft)}
.q .opts input{accent-color:var(--plum);width:18px;height:18px;flex:none}
.progress{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;border-radius:999px;background:var(--accent,var(--rose))}

/* Summary sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px 6px var(--r-md) var(--r-md);box-shadow:var(--shadow-hero);max-width:860px;margin:0 auto;overflow:hidden}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 28px;border-bottom:3px solid var(--plum)}
.sheet-top h2{font-size:1.5rem}
.sheet-top .meta{font-size:.88rem;color:var(--muted)}
.sheet-body{padding:8px 28px 28px}
.sheet-body section{padding:18px 0;border-bottom:1px solid var(--line)}
.sheet-body section:last-child{border-bottom:0}
.sheet-body h3{font-size:1.05rem;color:var(--plum);margin-bottom:10px}
@media (max-width:600px){.sheet-top,.sheet-body{padding-inline:16px}}

/* Emergency drawer */
.drawer{position:fixed;inset:0;z-index:150;display:none}
.drawer.on{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(23,17,26,.5)}
.drawer .dpanel{position:absolute;top:14px;inset-inline-end:14px;width:min(420px,calc(100% - 28px));background:var(--surface);border-radius:24px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.3);max-height:calc(100% - 28px);overflow:auto}
.phone{display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;background:var(--surface-2);margin-top:10px;text-decoration:none;color:var(--ink)}
.phone b{font-family:var(--font-display);font-size:1.5rem;font-weight:700;direction:ltr;min-width:122px;text-align:center;background:var(--surface);border-radius:12px;padding:4px 8px}
.phone.red b{color:var(--bad-ink)}
.phone small{display:block;color:var(--muted);font-size:.82rem}

.foot{border-top:1px solid var(--line);color:var(--muted);font-size:.86rem;padding:18px 36px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.foot .uni-logo{height:30px}
@media (max-width:1023px){.foot{padding:18px 16px calc(96px + env(safe-area-inset-bottom))}}
.sources li{margin:6px 0}
.about-logo .uni-logo{height:60px}
</style>
</head>
